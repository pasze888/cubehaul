name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # 手动触发（仅验证构建，不发布）

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # 缓存 Go module + build cache，key 随 go.sum 变化自动失效
          cache-dependency-path: go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags "-s -w" \
            -o dist/cubehaul-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .
      - name: Smoke test
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: ./dist/cubehaul-linux-amd64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: cubehaul-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/cubehaul-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "CubeHaul $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
